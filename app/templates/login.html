{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card login">
  <h1>Sign in</h1>
  <p class="muted">AI Knowledge, Skills &amp; Competencies self-assessment</p>
  <form method="post" action="/login">
    <label for="email">Work email</label>
    <input id="email" type="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required autocomplete="current-password">
    <div class="actions"><button class="btn" type="submit">Sign in</button></div>
  </form>
</div>
{% endblock %}
