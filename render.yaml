# Render Blueprint (optional; the service can also be created in the dashboard)
services:
  - type: web
    name: ai-ksc-assessment
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HTTPS_ONLY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      # First admin: sign in with this email and the generated password shown on the
      # service's Environment page in the Render dashboard (must be changed at first sign-in).
      - key: ADMIN_EMAIL
        value: admin@ksc.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-ksc-db
          property: connectionString
databases:
  - name: ai-ksc-db
    databaseName: ai_ksc_db
    user: ai_ksc_db_user
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
